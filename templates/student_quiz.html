<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz for Student</title>
</head>
<body>
    <h1>Quiz: {{ quiz.title }}</h1>
    <form action="{{ url_for('submit_answers', quiz_id=quiz.id) }}" method="POST">
        {% for soal in soal_data %}
            <div class="question">
                <p><strong>{{ soal.pertanyaan }}</strong></p>
                <ul>
                    {% for choice in soal.pilihan %}
                        <li>
                            <input type="radio" name="question_{{ soal.id }}" value="{{ choice.label }}">
                            {{ choice.label }}. {{ choice.text }}
                        </li>
                    {% endfor %}
                </ul>
            </div>
        {% endfor %}
        <button type="submit">Submit</button>
    </form>
</body>
</html>
